# =============================================================================
# project Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA project` and qualify tables
# as `project.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: project
version: 2
schema: project

# ADR-0014 company fence: every project-module table is company-private and fenced
# strict — a denormalized company_id column with a direct equality policy on
# `app.company_id` (migrations 20260426220008_enable_company_rls and
# 20260426220011_fence_child_tables_company_rls cover all seven tables:
# activity_types, projects, project_templates, project_template_tasks, tasks,
# timesheets, timesheet_details). No shared_blank or shared_tree entity exists here.
company_fence: strict
description: "project domain module"

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto
      # NOTE: `events` is intentionally NOT disabled. The domain/event + exports/events
      # surface is staged for a documented near-term consumer — the P2 backbone-support
      # integration, where backbone-project subscribes to `IssueEscalated` to open a
      # delivery project (see backbone-support/.../support_write_service.rs). Until that
      # lands the publishers are Noop* and the `events` Cargo feature is a no-op gate
      # (the files compile unconditionally); re-evaluate when P2 ships.

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model.
imports:
  - activity_type.model.yaml
  - project.model.yaml
  - task.model.yaml
  - timesheet.model.yaml
  - project_template.model.yaml
