# =============================================================================
# Domain: Project delivery
# Entities: Timesheet (+ TimesheetDetail)
# Description: Logged effort against a project. Each detail line snapshots a billing_rate
# and costing_rate (from an ActivityType) at log time, so billable = Σ hours·billing_rate
# and costing = Σ hours·costing_rate. A SUBMITTED timesheet with billable lines is the ONE
# outbound seam: it is handed to backbone-billing, which builds the timesheet-based Sales
# Invoice and posts the GL (Dr A/R · Cr Service Revenue · Cr PPN). Projects only records the
# echoed `invoice_id` and marks the timesheet BILLED. Posts NO GL itself.
# =============================================================================

models:
  - name: Timesheet
    collection: timesheets
    description: "Logged effort against a project; a billable submitted sheet hands off to billing"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique timesheet id"
      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Org owner # logical FK to organization.Company.id"
      project_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Project.id)"]
        description: "Project the time is logged against"
      employee_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Who logged the time # logical FK to sapiens.User.id / hr"
      currency:
        type: string
        attributes: ["@default('IDR')", "@length(3)"]
        description: "Currency code"
      status:
        type: TimesheetStatus
        attributes: ["@required", "@default(draft)"]
        description: "draft → submitted → billed / cancelled"
      total_hours:
        type: decimal
        attributes: ["@default(0)", "@precision(10,2)", "@non_negative"]
        description: "Σ line hours"
      total_billable_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ billable line amounts (is_billable lines only)"
      total_costing_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ costing line amounts (all lines)"
      invoice_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The Sales Invoice created on billing # logical FK to billing.SalesInvoice.id"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: index
        fields: [company_id, status]
      - type: index
        fields: [project_id]

  - name: TimesheetDetail
    collection: timesheet_details
    description: "One logged activity: hours at a snapshotted billing + costing rate"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"
      timesheet_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Timesheet.id)"]
        description: "Parent timesheet"
      activity_type_id:
        type: uuid?
        attributes: ["@foreign_key(ActivityType.id)"]
        description: "The activity performed (source of the rate snapshot)"
      task_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Task worked on (optional) # logical FK to Task.id"
      description:
        type: string?
        attributes: ["@max(280)"]
        description: "What was done"
      hours:
        type: decimal
        attributes: ["@required", "@precision(10,2)", "@positive"]
        description: "Hours logged"
      billing_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Rate charged per hour (snapshotted from the activity type at log time)"
      costing_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Internal cost per hour (snapshotted at log time)"
      is_billable:
        type: boolean
        attributes: ["@default(true)"]
        description: "Whether this line is charged to the customer"
      billable_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "hours × billing_rate (0 if not billable)"
      costing_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "hours × costing_rate"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: index
        fields: [timesheet_id]

enums:
  - name: TimesheetStatus
    description: "Timesheet lifecycle state"
    variants:
      - name: draft
        description: "Being filled in — mutable"
        default: true
      - name: submitted
        description: "Submitted — locked, billable to the customer"
      - name: billed
        description: "Handed to billing; a Sales Invoice exists"
      - name: cancelled
        description: "Cancelled"
