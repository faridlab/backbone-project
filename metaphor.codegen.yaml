# Codegen policy for project.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  - "src/application/service/project_events.rs"
  - "src/application/service/project_ports.rs"
  - "src/application/service/project_write_service.rs"
  # The write surface, chunked out of project_write_service.rs. Each is an `impl ProjectWriteService`
  # block; the shared vocabulary (input structs, outcome, error) stays in project_write_service.rs.
  - "src/application/service/project_lifecycle.rs"
  - "src/application/service/project_task.rs"
  - "src/application/service/project_financials.rs"
  - "src/application/service/project_billing.rs"
  - "src/application/service/project_service_delivery.rs"
  - "src/application/service/project_delete_guards.rs"
  # Own the hand-written project SQL (the delivery writes, the status-gated roll-up + its reversal, the
  # billing seam's at-most-once transition gates) that the write service orchestrates. Declared here —
  # not renamed with a `_custom` suffix — so the generator skips them wholesale; this declaration is
  # what makes editing them legitimate.
  - "src/infrastructure/persistence/activity_type_repository.rs"
  - "src/infrastructure/persistence/project_repository.rs"
  - "src/infrastructure/persistence/project_template_repository.rs"
  - "src/infrastructure/persistence/project_template_task_repository.rs"
  - "src/infrastructure/persistence/task_repository.rs"
  # The cross-schema read/write surface over the CONVERGED analytic row (timesheet module's
  # tables): approval gate, billable period lines, the invoice stamp/clear, financial sums,
  # live-row existence probes for the delete guards and the hybrid task-status derivation.
  - "src/infrastructure/persistence/converged_timesheet_repository.rs"
  - "tests/integrity_probes.rs"
  - "tests/project_billing_seam.rs"
  - "tests/project_golden_cases.rs"
  - "tests/query_service_port.rs"
  - "tests/convergence_probes.rs"
  # Shared test helpers (pool factory, capturing event sink, fake + real billing
  # adapters) hand-written for the four test files above; consumed via `mod common;`.
  - "tests/common/mod.rs"
  # Module-template saga scaffolding (Example* symbols; no schema-derived content,
  # not wired into src/application/mod.rs). Hand-written, so the generator must
  # leave it alone.
  - "src/application/workflows/mod.rs"
  - "scripts/**"
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # - "tests/*_golden_cases.rs"
  # - "tests/integrity_probes.rs"

  # The model-retirement migration: drops this module's own timesheet tables, audit
  # functions, and status enum (the converged analytic row lives in the timesheet module)
  # and adds the origin-key uniques backing the confirm-mint idempotency — hand-owned
  # because a drop-and-retire ALTER is not schema-derivable.
  - "migrations/20260829120000_retire_local_timesheet_model.up.sql"
  - "migrations/20260829120000_retire_local_timesheet_model.down.sql"
  # Enforcement declarations the schema tree does not derive: the delete guards over
  # converged rows and the origin-key uniqueness backstops.
  - "schema/hooks/convergence_guards.hook.yaml"

  # Hand-authored module documentation.
  - "docs/**"
