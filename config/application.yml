server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/project.log
module:
  name: project
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  activity_type:
    collection: activity_types
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  project:
    collection: projects
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  project_template:
    collection: project_templates
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  project_template_task:
    collection: project_template_tasks
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  task:
    collection: tasks
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  timesheet:
    collection: timesheets
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  timesheet_detail:
    collection: timesheet_details
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
